name: Production environment preflight

on:
  workflow_dispatch:
    inputs:
      firebase_remote_config:
        description: Audit Firebase production Remote Config or add missing production defaults
        type: choice
        default: audit
        options: [audit, align]

permissions:
  contents: read

jobs:
  validate:
    name: Validate protected production settings
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Test Firebase template preservation
        working-directory: backend
        run: go test ./cmd/firebase-remote-config
      - name: Audit or align production Firebase Remote Config
        working-directory: backend
        env:
          PRODUCTION_ENV_FILE: ${{ secrets.PRODUCTION_ENV_FILE }}
          FIREBASE_MOBILE_CONFIG_JSON: ${{ secrets.FIREBASE_MOBILE_CONFIG_JSON }}
          MODE: ${{ inputs.firebase_remote_config }}
        run: |
          set -euo pipefail
          if [ "$MODE" = align ]; then
            go run ./cmd/firebase-remote-config --publish
          else
            go run ./cmd/firebase-remote-config
          fi
      - name: Save Remote Config rollback templates
        if: always() && inputs.firebase_remote_config == 'align'
        uses: actions/upload-artifact@v4
        with:
          name: firebase-remote-config-templates
          path: backend/remote-config-*.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove temporary Remote Config templates
        if: always()
        run: rm -f backend/remote-config-before.json backend/remote-config-after.json
